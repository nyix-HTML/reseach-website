<!-- index.html (Main Page) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aetheris // Modular Architecture</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
    <style>
        body { background: #0b0f19; color: #f8fafc; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #131c2e; border: 1px solid #2a3b5e; padding: 30px; border-radius: 12px; width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        textarea { width: 100%; height: 100px; background: #0b0f19; border: 1px solid #2a3b5e; color: #f8fafc; padding: 12px; border-radius: 6px; resize: none; margin-bottom: 12px; outline: none; }
        button { background: #38bdf8; color: #0b0f19; border: none; padding: 10px 20px; font-weight: 600; border-radius: 6px; cursor: pointer; }
        #output { margin-top: 20px; max-height: 250px; overflow-y: auto; line-height: 1.6; font-size: 0.95rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Aetheris Modular Engine</h2>
        <textarea id="promptInput" placeholder="Ask Gemini research engine..."></textarea>
        <button onclick="handleResearch()">Synthesize via Module</button>
        <div id="output">Output will render here...</div>
    </div>

    <!-- Import the external logic script module -->
    <script type="module">
        import { synthesizeResearch } from './gemini-engine.js';

        window.handleResearch = async () => {
            const query = document.getElementById('promptInput').value;
            const outputEl = document.getElementById('output');
            
            if (!query) return;
            outputEl.innerHTML = "Querying modular Gemini engine...";
            
            const resultHtml = await synthesizeResearch(query);
            outputEl.innerHTML = resultHtml;
        };
    </script>
</body>
</html>
